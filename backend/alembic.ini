# Configuración de Alembic para el backend de turnos.
#
# No se fija `sqlalchemy.url` acá a propósito: `alembic/env.py` la resuelve
# desde `DATABASE_URL` (settings de la app), de modo que dev y prod usan la
# misma fuente que el resto del backend. Al invocar el CLI, exportá
# `DATABASE_URL` (o dejá el default `sqlite:///./clinica.db`).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
