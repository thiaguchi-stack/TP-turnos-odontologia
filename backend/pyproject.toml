[project]
name = "clinica-turnos"
version = "0.1.0"
description = "API de gestión de turnos para un consultorio odontológico (TP Metodología I)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]